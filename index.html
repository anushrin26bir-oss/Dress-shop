!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Élan Boutique | Dress Collection</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #faf7f5;
      color: #2c2420;
    }

    header {
      background-color: #2c2420;
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 {
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 1.8rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    input[type="text"], select {
      padding: 0.6rem 1rem;
      border: 1px solid #d4c8c1;
      border-radius: 4px;
      font-size: 0.95rem;
      background: #fff;
    }

    .cart-badge {
      background-color: #c88a73;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      font-weight: 600;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid #ece3dd;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(44, 36, 32, 0.08);
    }

    .dress-banner {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background: linear-gradient(135deg, #f3e6e0, #e6d2c7);
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .dress-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8c7a70;
      margin-bottom: 0.3rem;
    }

    .dress-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .dress-price {
      font-size: 1.1rem;
      color: #a65e46;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    button {
      background-color: #2c2420;
      color: #fff;
      border: none;
      padding: 0.65rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #a65e46;
    }
  </style>
</head>
<body>

  <header>
    <h1>ÉLAN BOUTIQUE</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search dress name...">
      <select id="sortSelect">
        <option value="default">Sort by Price</option>
        <option value="low">Low to High</option>
        <option value="high">High to Low</option>
      </select>
      <div class="cart-badge">Bag: <span id="cartCount">0</span></div>
    </div>
  </header>

  <main>
    <div class="grid" id="dressGrid"></div>
  </main>

  <script>
    // Dress catalog data (easily add or edit dresses here)
    const dresses = [
      { id: 1, name: "Silk Evening Gown", category: "Evening", price: 4500, icon: "👗" },
      { id: 2, name: "Floral Midi Sundress", category: "Casual", price: 1850, icon: "🌸" },
      { id: 3, name: "Velvet Cocktail Dress", category: "Party", price: 3200, icon: "✨" },
      { id: 4, name: "Linen Wrap Dress", category: "Summer", price: 2100, icon: "🌿" },
      { id: 5, name: "Embroidered Anarkali", category: "Festive", price: 5400, icon: "🪡" },
      { id: 6, name: "Satin Slip Dress", category: "Evening", price: 2750, icon: "🥂" }
    ];

    let cartCount = 0;
    const dressGrid = document.getElementById("dressGrid");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const cartCountEl = document.getElementById("cartCount");

    function renderDresses(items) {
      dressGrid.innerHTML = "";
      items.forEach(dress => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="dress-banner">${dress.icon}</div>
          <div class="card-body">
            <div>
              <div class="dress-category">${dress.category}</div>
              <div class="dress-name">${dress.name}</div>
              <div class="dress-price">₹${dress.price.toLocaleString("en-IN")}</div>
            </div>
            <button onclick="addToBag('${dress.name}')">Add to Bag</button>
          </div>
        `;
        dressGrid.appendChild(card);
      });
    }

    function addToBag(dressName) {
      cartCount++;
      cartCountEl.textContent = cartCount;
      alert(`Added "${dressName}" to your shopping bag!`);
    }

    function updateDisplay() {
      const query = searchInput.value.toLowerCase();
      const sortOrder = sortSelect.value;

      let filtered = dresses.filter(d => d.name.toLowerCase().includes(query));

      if (sortOrder === "low") {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortOrder === "high") {
        filtered.sort((a, b) => b.price - a.price);
      }

      renderDresses(filtered);
    }

    searchInput.addEventListener("input", updateDisplay);
    sortSelect.addEventListener("change", updateDisplay);

    // Initial render
    renderDresses(dresses);
  </script>

</body>
</html>
